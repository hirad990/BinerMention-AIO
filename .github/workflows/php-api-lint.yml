name: PHP API lint

on:
  push:
    branches: [main]
    paths:
      - 'PHP-API/**'
      - '.github/workflows/php-api-lint.yml'
  pull_request:
    paths:
      - 'PHP-API/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, fileinfo, mbstring
          coverage: none
      - name: Syntax check PHP files
        run: |
          find PHP-API -type f -name '*.php' -print0 | xargs -0 -n1 php -l

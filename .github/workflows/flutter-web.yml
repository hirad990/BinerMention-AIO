name: BinerMention Flutter Web

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/flutter-web.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/flutter-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build adaptive Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-web-${{ runner.os }}-${{ hashFiles('android/pubspec.yaml') }}

      - name: Generate Flutter Web scaffold
        run: flutter create --platforms=web --org ir.binercraft --project-name binerm_mention "$RUNNER_TEMP/binerm_mention"

      - name: Inject BinerMention Flutter source
        run: |
          cp android/pubspec.yaml "$RUNNER_TEMP/binerm_mention/pubspec.yaml"
          rm -rf "$RUNNER_TEMP/binerm_mention/lib" "$RUNNER_TEMP/binerm_mention/test"
          cp -R android/lib "$RUNNER_TEMP/binerm_mention/lib"
          if [ -d android/test ]; then cp -R android/test "$RUNNER_TEMP/binerm_mention/test"; fi
          mkdir -p "$RUNNER_TEMP/binerm_mention/web/icons"
          cp android/web/manifest.json "$RUNNER_TEMP/binerm_mention/web/manifest.json"
          cp android/web/binermention-push-sw.js "$RUNNER_TEMP/binerm_mention/web/binermention-push-sw.js"
          python3 - "$RUNNER_TEMP/binerm_mention/web/icons" <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image, ImageOps
          source = Image.open("f9ce68bae32185e60d387b03ed84504f88a5cc7c.png").convert("RGBA")
          target = Path(sys.argv[1])
          for size in (192, 512):
              icon = ImageOps.fit(source, (size, size), method=Image.Resampling.LANCZOS)
              icon.save(target / f"icon-{size}.png", optimize=True)
          PY
          python3 - "$RUNNER_TEMP/binerm_mention/web/index.html" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          html = p.read_text()
          tags = '''
          <meta name="mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <meta name="apple-mobile-web-app-title" content="BinerMention">
          <link rel="apple-touch-icon" href="icons/icon-192.png">
          <link rel="manifest" href="manifest.json">
          <script>
            if ('serviceWorker' in navigator) {
              window.addEventListener('load', () => {
                navigator.serviceWorker.register('binermention-push-sw.js', { scope: './' }).catch(console.error);
              });
            }
          </script>
          '''
          if 'binermention-push-sw.js' not in html:
              html = html.replace('</head>', tags + '\n</head>')
          p.write_text(html)
          PY

      - name: Resolve Flutter dependencies
        working-directory: ${{ runner.temp }}/binerm_mention
        run: flutter pub get

      - name: Format Dart source
        working-directory: ${{ runner.temp }}/binerm_mention
        run: dart format lib

      - name: Analyze Flutter source
        working-directory: ${{ runner.temp }}/binerm_mention
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        working-directory: ${{ runner.temp }}/binerm_mention
        run: |
          if [ -d test ]; then flutter test --reporter expanded; else echo 'No Flutter tests directory; skipping.'; fi

      - name: Build release Web bundle
        working-directory: ${{ runner.temp }}/binerm_mention
        run: flutter build web --release --base-href /mention/

      - name: Verify Web output
        run: |
          test -s "$RUNNER_TEMP/binerm_mention/build/web/index.html"
          test -s "$RUNNER_TEMP/binerm_mention/build/web/flutter_bootstrap.js"
          test -s "$RUNNER_TEMP/binerm_mention/build/web/manifest.json"
          test -s "$RUNNER_TEMP/binerm_mention/build/web/binermention-push-sw.js"
          test -s "$RUNNER_TEMP/binerm_mention/build/web/icons/icon-512.png"
          mkdir -p "$RUNNER_TEMP/BinerMention-Web"
          cp -R "$RUNNER_TEMP/binerm_mention/build/web/." "$RUNNER_TEMP/BinerMention-Web/"
          cd "$RUNNER_TEMP"
          zip -qry BinerMention-Flutter-Web.zip BinerMention-Web
          test -s "$RUNNER_TEMP/BinerMention-Flutter-Web.zip"

      - name: Upload Flutter Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: BinerMention-Flutter-Web
          path: ${{ runner.temp }}/BinerMention-Flutter-Web.zip
          if-no-files-found: error
          retention-days: 30

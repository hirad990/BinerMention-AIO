name: BinerMention Web CI and Dist
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/binerm-mention-web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/binerm-mention-web.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: binerm-mention-web-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: BinerMention-web-dist
          path: web/out/
          if-no-files-found: error
          retention-days: 14
